services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kitdesk
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: kitdesk
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["desk-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitdesk"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports: ["127.0.0.1:5080:8080"]
    environment:
      ConnectionStrings__Desk: Host=db;Database=kitdesk;Username=kitdesk;Password=local-only
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      db: { condition: service_healthy }
volumes:
  desk-data:
