name: Verify KitDesk
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kitdesk
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: kitdesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kitdesk"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      ConnectionStrings__Desk: Host=localhost;Database=kitdesk;Username=kitdesk;Password=ci-only
      KITDESK_TEST_DATABASE: Host=localhost;Database=kitdesk;Username=kitdesk;Password=ci-only
      ASPNETCORE_ENVIRONMENT: Development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: dotnet restore --locked-mode
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build -c Release --no-restore -warnaserror
      - run: dotnet test -c Release --no-build --logger "trx;LogFileName=backend.trx" --results-directory TestResults
      - run: npm ci && npm run lint && npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: dotnet run --project src/KitDesk -c Release -- --migrate
      - run: dotnet run --project src/KitDesk -c Release --no-build --urls http://127.0.0.1:5080 > /tmp/kitdesk.log 2>&1 &
      - run: curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:5080/healthz
      - run: npm run test:browser
        working-directory: web
      - run: docker build -t kitdesk:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            TestResults/
            web/test-results/
            web/playwright-report/
            docs/screenshots/
            docs/recordings/
            /tmp/kitdesk.log
